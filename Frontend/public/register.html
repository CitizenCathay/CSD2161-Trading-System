<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TradeFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                        },
                        trade: {
                            green: '#10b981',
                            red: '#ef4444',
                            accent: '#3b82f6'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        html { scrollbar-gutter: stable; }
        
        body { font-family: 'Inter', sans-serif; }
        
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .input-dark {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            color: white;
            transition: all 0.3s ease;
        }
        
        .input-dark:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .input-dark::placeholder {
            color: #64748b;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
        }
        
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        
        .glow-bg {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        
        .glow-1 { top: -200px; left: -200px; }
        .glow-2 { bottom: -200px; right: -200px; background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%); }
    </style>
</head>
<body class="bg-dark-900 text-white antialiased overflow-x-hidden relative">

    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <nav class="fixed w-full z-50 glass">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-green-500 rounded-lg flex items-center justify-center">
                        <i data-lucide="trending-up" class="w-5 h-5 text-white"></i>
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-green-400 bg-clip-text text-transparent">TradeFlow</span>
                </div>

                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-400 hover:text-white font-medium transition-colors flex items-center space-x-2 group">
                        <div class="w-8 h-8 rounded-lg bg-dark-800 flex items-center justify-center group-hover:bg-dark-700 transition-colors">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        </div>
                        <span>Back to Home</span>
                    </a>
                    <div class="relative hidden md:block">
                        <button id="profile-button" class="hidden w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-green-500 flex items-center justify-center text-white font-bold text-xs" type="button">
                            <span id="profile-initials">?</span>
                        </button>
                        <div id="profile-menu" class="hidden absolute right-0 mt-3 w-56 glass rounded-xl border border-gray-700/50 overflow-hidden">
                            <div class="px-4 py-3 border-b border-gray-700/50">
                                <p class="text-xs text-gray-500">Signed in as</p>
                                <p id="profile-username" class="text-sm font-semibold text-white truncate">-</p>
                            </div>
                            <div class="py-2">
                                <a href="portfolio.html" class="block px-4 py-2 text-sm text-gray-300 hover:bg-dark-800/60 hover:text-white transition">Portfolio</a>
                                <a href="/trade" class="block px-4 py-2 text-sm text-gray-300 hover:bg-dark-800/60 hover:text-white transition">Trade</a>
                                <button id="logout-button" class="w-full text-left px-4 py-2 text-sm text-red-200 hover:bg-red-500/10 transition" type="button">Logout</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-4 sm:px-6 lg:px-8 min-h-screen flex items-center justify-center relative z-10">
        <div class="w-full max-w-md">
            <div class="glass rounded-3xl overflow-hidden">
                <div class="p-8 space-y-6">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-white mb-2">Create Account</h2>
                        <p class="text-gray-400">Start your trading journey today</p>
                        <p class="text-sm text-gray-500 mt-3">
                            Already have an account?
                            <a href="/login" class="text-trade-accent hover:text-blue-400 font-medium transition-colors">Sign in</a>
                        </p>
                    </div>

                    <form class="space-y-5" onsubmit="handleRegister(event)">
                        <div id="register-message" class="hidden text-sm rounded-xl px-4 py-3 border"></div>

                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-300 flex items-center space-x-2">
                                <i data-lucide="user" class="w-4 h-4 text-trade-accent"></i>
                                <span>Username</span>
                            </label>
                            <input type="text" id="register-username" required 
                                class="w-full px-4 py-3.5 rounded-xl input-dark outline-none"
                                placeholder="trader">
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-300 flex items-center space-x-2">
                                <i data-lucide="lock" class="w-4 h-4 text-trade-accent"></i>
                                <span>Password</span>
                            </label>
                            <div class="relative">
                                <input type="password" id="register-password" required 
                                    class="w-full px-4 py-3.5 rounded-xl input-dark outline-none pr-12"
                                    placeholder="Min 8 characters">
                                <button type="button" onclick="togglePassword('register-password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors">
                                    <i data-lucide="eye" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        <label class="flex items-start space-x-3 cursor-pointer group">
                            <input type="checkbox" required class="mt-1 w-4 h-4 rounded border-dark-600 bg-dark-800 text-trade-accent focus:ring-trade-accent/20 focus:ring-2">
                            <span class="text-sm text-gray-400 group-hover:text-gray-300 transition-colors">
                                I agree to the <a href="#" class="text-trade-accent hover:text-blue-400 font-medium">Terms of Service</a> and <a href="#" class="text-trade-accent hover:text-blue-400 font-medium">Privacy Policy</a>
                            </span>
                        </label>

                        <button type="submit" class="w-full bg-gradient-to-r from-trade-green to-emerald-600 hover:from-emerald-500 hover:to-emerald-700 text-white py-3.5 rounded-xl font-semibold transition-all hover:shadow-lg hover:shadow-trade-green/20 hover:-translate-y-0.5 flex items-center justify-center space-x-2 group">
                            <span>Create Account</span>
                            <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                    </form>
                </div>
            </div>

            <div class="mt-8 text-center space-y-4">
                <p class="text-sm text-gray-500">
                    Need help? <a href="#" class="text-trade-accent hover:text-blue-400 font-medium transition-colors">Contact Support</a>
                </p>
                <div class="flex justify-center space-x-6 text-sm text-gray-600">
                    <a href="#" class="hover:text-gray-400 transition-colors">Privacy</a>
                    <a href="#" class="hover:text-gray-400 transition-colors">Terms</a>
                    <a href="#" class="hover:text-gray-400 transition-colors">Security</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function base64UrlDecode(input) {
            let str = input.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) str += '=';
            const decoded = atob(str);
            return decodeURIComponent(decoded.split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        }

        function getUsernameFromToken() {
            const token = localStorage.getItem('token');
            if (!token) return null;
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            try {
                const payload = JSON.parse(base64UrlDecode(parts[1]));
                if (!payload || typeof payload.sub !== 'string') return null;
                if (typeof payload.exp === 'number' && Math.floor(Date.now() / 1000) >= payload.exp) {
                    localStorage.removeItem('token');
                    return null;
                }
                return payload.sub;
            } catch {
                return null;
            }
        }

        function initialsFor(username) {
            const name = (username || '').trim();
            if (!name) return '?';
            const parts = name.split(/[^A-Za-z0-9]+/).filter(Boolean);
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return parts[0].slice(0, 2).toUpperCase();
        }

        function setupProfileNav() {
            const username = getUsernameFromToken();
            const profileButton = document.getElementById('profile-button');
            const profileMenu = document.getElementById('profile-menu');
            if (!profileButton || !profileMenu) return;
            if (!username) {
                profileButton.classList.add('hidden');
                return;
            }

            profileButton.classList.remove('hidden');
            document.getElementById('profile-initials').textContent = initialsFor(username);
            document.getElementById('profile-username').textContent = username;

            profileButton.addEventListener('click', () => {
                profileMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!profileMenu.contains(e.target) && !profileButton.contains(e.target)) {
                    profileMenu.classList.add('hidden');
                }
            });

            document.getElementById('logout-button').addEventListener('click', () => {
                localStorage.removeItem('token');
                window.location.href = '/login';
            });
        }

        setupProfileNav();

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            
            lucide.createIcons();
        }

        async function handleRegister(e) {
            e.preventDefault();
            const button = e.target.querySelector('button[type="submit"]');
            const originalContent = button.innerHTML;

            const message = document.getElementById('register-message');
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;

            message.classList.add('hidden');
            message.textContent = '';

            button.disabled = true;
            button.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Creating account...</span>';
            button.classList.add('opacity-80', 'cursor-not-allowed');
            lucide.createIcons();

            try {
                const backendBase = (window.location.protocol === 'file:')
                    ? 'http://localhost:8080'
                    : `${window.location.protocol}//${window.location.hostname}:8080`;

                const res = await fetch(`${backendBase}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json().catch(() => null);
                if (!res.ok) {
                    const errorText = data && typeof data.error === 'string' ? data.error : 'Registration failed';
                    message.textContent = errorText;
                    message.className = 'text-sm rounded-xl px-4 py-3 border border-red-500/30 bg-red-500/10 text-red-200';
                    message.classList.remove('hidden');
                    return;
                }

                message.textContent = 'Account created. You can sign in now.';
                message.className = 'text-sm rounded-xl px-4 py-3 border border-emerald-500/30 bg-emerald-500/10 text-emerald-100';
                message.classList.remove('hidden');
                setTimeout(() => { window.location.href = '/login'; }, 800);
            } catch (err) {
                message.textContent = 'Network error';
                message.className = 'text-sm rounded-xl px-4 py-3 border border-red-500/30 bg-red-500/10 text-red-200';
                message.classList.remove('hidden');
            } finally {
                button.disabled = false;
                button.innerHTML = originalContent;
                button.classList.remove('opacity-80', 'cursor-not-allowed');
                lucide.createIcons();
            }
        }

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            
            document.querySelectorAll('.glow-bg').forEach((glow, index) => {
                const factor = index === 0 ? 1 : -1;
                glow.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
            });
        });
    </script>
</body>
</html>
